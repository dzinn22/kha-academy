        <style>
            .redirect-message {

                z-index: 1000;
                animation: fadeInDown 0.5s ease-out;

            }

            @keyframes fadeInDown {
                from {
                    opacity: 0;
                    transform: translateY(-20px);
                }

                    opacity: 1;
                    transform: translateY(0);

        <!-- Script para mostrar a mensagem de redirecionamento -->
        <script type="4f04d258b207ac9e17c6e20a-text/javascript">
            
        // Se tiver token, mostra a mensagem antes de redirecionar
        if (localStorage.getItem('discord_token')) {
            document.getElementById('redirectMessage').style.display = 'block';
            setTimeout(() => {
                window.location.href = '/';
            }, 1500);
        }
